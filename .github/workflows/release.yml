name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  binaries:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: make test test-e2e
      - name: Build and package binaries
        run: |
          mkdir -p dist
          staging="$(mktemp -d)"
          for os in linux darwin; do
            for arch in amd64 arm64; do
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -o "$staging/pipkin" ./cmd/pipkin
              tar -czf "dist/pipkin-$os-$arch.tar.gz" -C "$staging" pipkin -C "$GITHUB_WORKSPACE" LICENSE
            done
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          cp install.sh dist/install.sh
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*
          else
            gh release create "$TAG" --verify-tag --generate-notes dist/*
          fi

  image:
    runs-on: ubuntu-latest
    needs: binaries
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/jakekalstad/pipkin
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: WITH_LANGGRAPH=true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
